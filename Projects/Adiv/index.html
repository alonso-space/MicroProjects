<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <title>Adiv</title>
</head>
<body>

    <aside class="presentation">
        <h1>Adiv</h1>
        <p>Adivina el número secreto.</p>
    </aside>

    <section class="game">

        <input type="number" class="guessSpace" readonly>

        <div>
            <button class="num Btn">1</button>
            <button class="num Btn">2</button>
            <button class="num Btn">3</button>
        </div>

        <div>
            <button class="num Btn">4</button>
            <button class="num Btn">5</button>
            <button class="num Btn">6</button>
        </div>

        <div>
            <button class="num Btn">7</button>
            <button class="num Btn">8</button>
            <button class="num Btn">9</button>
        </div>

        <div>
            <button class="supr Btn">X</button>
            <button class="num Btn">0</button>
            <button class="check Btn">Y</button>
        </div>

    </section>

    <aside class="options">
    <h1 class="indicator">Adiv</h1>
    <h2 class="triesCounter">Intentos: 0</h2>
    <div>
        <button class="diff Btn" data-value="10">10</button>
        <button class="diff Btn" data-value="100">100</button>
        <button class="diff Btn" data-value="1000">1000</button>
    </div>

    <div>
        <button class="diff Btn" data-value="10000">10K</button>
        <button class="diff Btn" data-value="100000">100K</button>
        <button class="diff Btn" data-value="1000000">1M</button>
    </div>

    <div>
        <input type="color" class="BGpicker">
    </div>
    
    </aside>

</body>
</html>
